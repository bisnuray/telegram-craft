name: Telegram quality gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  telegram-quality:
    runs-on: ubuntu-latest
    env:
      TG_LINT_REQUIRE_INTERACTIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Tests and Telegram payload gate
        run: pytest -q
      - name: Keep the capture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-quality-report
          path: .tg-lint/
          if-no-files-found: ignore
